# Local stack that matches the deployment: the API against PostgreSQL.
#
# Since ADR-22 the `postgres` service is also what day-to-day development and
# the test suite run against — there is no SQLite path any more, because the
# glossary, the correction log and the message memory are `vector` columns and
# SQLite has no such type. Most of the time only the database is wanted:
#
#   docker compose up -d postgres    # database only, backend runs on the host
#   docker compose up --build        # whole stack, closest to production
#
# The frontend is not here on purpose: it is deployed to Vercel (docs/DEPLOY.md),
# and a second Dockerfile for Next.js would be a build to maintain that nothing
# in production would ever use. Run it with `npm run dev` alongside.

services:
  postgres:
    # pgvector's image, not plain `postgres`: the schema declares `vector`
    # columns, so on stock PostgreSQL it fails at CREATE TABLE (ADR-22).
    # Pinned to pg16 to match the service container in .github/workflows/ci.yml.
    image: pgvector/pgvector:pg16
    # Published to the host because the backend usually runs outside the
    # container during development, and pytest always does.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: linguaflow
      POSTGRES_PASSWORD: linguaflow
      POSTGRES_DB: linguaflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever .env says: from inside the network the database is
      # reachable as `postgres`, while .env names `localhost` for the host.
      DATABASE_URL: postgresql+asyncpg://linguaflow:linguaflow@postgres:5432/linguaflow
      UPLOAD_DIR: /app/data/uploads
    volumes:
      # Uploaded files only. The database now lives in the postgres service.
      - backend-uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  backend-uploads:
